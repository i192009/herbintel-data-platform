[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["services/processing-python"]
markers = ["integration: requires Compose services", "cloud: requires real Snowflake and AWS credentials"]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [".venv*", ".tools", "dbt/herbintel/target", "dbt/herbintel/dbt_packages"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "skip"
files = ["services/processing-python/herbintel"]
