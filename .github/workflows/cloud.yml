name: Explicit live Snowflake and Snowpipe verification
on: {workflow_dispatch: {}}
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    environment: snowflake-integration
    timeout-minutes: 40
    env:
      SNOWFLAKE_ACCOUNT: '${{ secrets.SNOWFLAKE_ACCOUNT }}'
      SNOWFLAKE_USER: '${{ secrets.SNOWFLAKE_USER }}'
      SNOWFLAKE_PASSWORD: '${{ secrets.SNOWFLAKE_PASSWORD }}'
      AWS_ACCESS_KEY_ID: '${{ secrets.AWS_ACCESS_KEY_ID }}'
      AWS_SECRET_ACCESS_KEY: '${{ secrets.AWS_SECRET_ACCESS_KEY }}'
      AWS_BUCKET: '${{ vars.AWS_BUCKET }}'
      AWS_REGION: '${{ vars.AWS_REGION }}'
      SNOWFLAKE_LOAD_STRATEGY: snowpipe
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && mkdir -p artifacts datasets/generated && chmod 777 artifacts datasets/generated
      - run: docker compose up -d --build
      - name: Wait for processing health
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:8000/healthz && curl -fsS http://localhost:18080/readyz; then exit 0; fi
            sleep 3
          done
          exit 1
      - run: python3 scripts/manage.py acceptance --count 100 --direct
      - run: python3 scripts/manage.py snowflake-verify
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: cloud-results, path: artifacts/}
      - run: docker compose down
        if: always()
