global:
  scrape_interval: 10s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: ingestion
    static_configs: [{targets: ['ingestion:8080']}]
  - job_name: worker
    static_configs: [{targets: ['worker:8000']}]
  - job_name: prometheus
    static_configs: [{targets: ['localhost:9090']}]
  - job_name: airflow
    static_configs: [{targets: ["statsd:9102"]}]
