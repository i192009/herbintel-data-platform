herbintel:
  target: test
  outputs:
    test: &connection
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT', 'offline') }}"
      user: "{{ env_var('SNOWFLAKE_USER', 'offline') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD', 'offline') }}"
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_FILE', '') or none }}"
      private_key_passphrase: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PASSPHRASE', '') or none }}"
      authenticator: "{{ env_var('SNOWFLAKE_AUTHENTICATOR', 'snowflake') }}"
      role: "{{ env_var('SNOWFLAKE_DBT_ROLE', 'HERBINTEL_TRANSFORMER') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'HERBINTEL_WH') }}"
      database: "{{ env_var('SNOWFLAKE_TEST_DATABASE', 'HERBINTEL_TEST') }}"
      schema: AUDIT
      threads: 2
      client_session_keep_alive: false
      query_tag: herbintel_dbt_test
    cloud:
      <<: *connection
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'HERBINTEL') }}"
      query_tag: herbintel_dbt_cloud
