version: 2
sources:
- name: raw
  database: '{{ target.database }}'
  schema: RAW
  tables:
  - name: DOCUMENT_METADATA
    description: Immutable ingested document versions, stored as VARIANT envelopes.
  - name: EXTRACTION_RESULTS
    description: Validated extraction records and quality metadata.
  - name: PROCESSING_RUNS
    description: Processing counts by batch and pipeline revision.
  - name: DATASET_MANIFESTS
    description: Verified publication manifests and source lineage.
  - name: DOCUMENT_EVENTS
    description: Idempotent processing event envelopes.
  config:
    loaded_at_field: loaded_at
    freshness:
      warn_after:
        count: 24
        period: hour
      error_after:
        count: 72
        period: hour
